name: Compile Java

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile all Java files
        run: |
          find . -name "*.java" > sources.txt
          mkdir -p out
          javac -d out @sources.txt